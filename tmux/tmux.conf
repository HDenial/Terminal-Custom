### --- GENERAL SETTINGS ---

# Use 256 colors
set -g default-terminal "screen-256color"

# Enable mouse support (click to select panes, scroll, etc.)
set -g mouse on

# Automatically reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config"

# Use vim-style copy mode keys
setw -g mode-keys vi


### --- KEY BINDINGS ---

# Change prefix from Ctrl-b to Ctrl-a (like GNU Screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Easier pane splitting
bind e split-window -h
bind q split-window -v
unbind '"'
unbind %

# Quick pane navigation (vim-style)
bind j select-pane -L
bind k select-pane -D
bind i select-pane -U
bind l select-pane -R

# Resize panes
bind -r J resize-pane -L 5
bind -r K resize-pane -D 5
bind -r I resize-pane -U 5
bind -r L resize-pane -R 5

# Quick new window
bind c new-window -c "#{pane_current_path}"

# Quick kill pane/window
bind x kill-pane
bind w kill-window


### --- STATUS BAR / APPEARANCE ---

# Set status bar refresh interval
set -g status-interval 5

# Status bar colors
set -g status-bg colour235
set -g status-fg colour136
set -g status-style default

# Left side: session name
set -g status-left-length 30
set -g status-left "#[fg=grey]#S #[fg=grey]|"

# Right side: date, time, host
set -g status-right-length 100
set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=yellow]%H:%M #[fg=red]#H"

# Window title colors
setw -g window-status-format "#[fg=red]#I:#W"
setw -g window-status-current-format "#[fg=black,bg=red]#I:#W"


### --- QUALITY OF LIFE ---

# Start windows and panes at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Set scrollback history
set -g history-limit 10000

# Enable focus events for terminal editors (e.g., vim, neovim)
set -g focus-events on

# Automatically rename windows
setw -g automatic-rename on

# Allow faster command repeats
set -g repeat-time 500

# Enable true color (if your terminal supports it)
set -g terminal-overrides ',xterm-256color:Tc'
